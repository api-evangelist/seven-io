aid: seven-io

name: seven.io

image: https://www.seven.io/wp-content/uploads/Logo_Prev-1024x220.png

description: seven.io (formerly sms77) is a German CPaaS provider in Kiel offering a REST API for SMS, voice calls, RCS, WhatsApp, number lookup
  (HLR/MNP/CNAM), contacts and webhooks.

