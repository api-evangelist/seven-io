paths:
  /api/numbers/active/{number}:
    delete:
      operationId: delete_api_numbers_active_number
      tags:
      - Numbers
      summary: Delete a single active number by providing the phone number
      x-source: https://docs.seven.io/en/rest-api/endpoints/numbers
      parameters:
      - name: number
        in: path
        required: true
        schema:
          type: string
      - name: delete_immediately
        in: query
        required: false
        schema:
          type: boolean
        description: If set to true, the number will be deleted immediately. If set to false, the number will be deleted at the end of the current billing period.
      responses:
        '200':
          description: Success (status as documented)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteApiNumbersActiveNumberResponse'
      x-evidence:
        kind: documentation
    patch:
      operationId: patch_api_numbers_active_number
      tags:
      - Numbers
      summary: Update the details of a single active number by providing the phone number
      x-source: https://docs.seven.io/en/rest-api/endpoints/numbers
      parameters:
      - name: number
        in: path
        required: true
        schema:
          type: string
      - name: friendly_name
        in: query
        required: false
        schema:
          type: string
        description: The updated friendly name for the number.
      - name: sms_forward
        in: query
        required: false
        schema:
          type: array
        description: The phone number to forward incoming SMS to. If empty, incoming SMS won't be forwarded by SMS.
      - name: email_forward
        in: query
        required: false
        schema:
          type: array
        description: The email address to forward incoming SMS to. If empty, incoming SMS won't be forwarded by email.
      - name: slack_forward
        in: query
        required: false
        schema:
          type: string
        description: The Slack webhook URL to forward incoming SMS to. If empty, incoming SMS won't be forwarded by Slack.
      responses:
        '200':
          description: Success (status as documented)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatchApiNumbersActiveNumberResponse'
      x-evidence:
        kind: documentation
  /api/numbers/{numberid}:
    get:
      operationId: get_api_numbers_numberid
      tags:
      - Numbers
      summary: Get a list of all active numbers that are currently associated with your account
      x-source: https://docs.seven.io/en/rest-api/endpoints/numbers
      parameters:
      - name: numberid
        in: path
        required: true
        schema:
          type: string
      - name: country
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Success (status as documented)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetApiNumbersNumberidResponse'
      x-evidence:
        kind: documentation
        collapsed_from: 2 example path(s) differing only at numberId
