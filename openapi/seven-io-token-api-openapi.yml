components:
  schemas:
    GetTokenResponse:
      type: object
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
        token_type:
          type: string
        scope:
          type: string
        refresh_token:
          type: string
    PostTokenRequest:
      type: object
      properties:
        grant_type:
          type: string
          description: Either 'authorization_code' or 'refresh_token'
        code:
          type: string
          description: The authorization code from step 3 (required when grant_type is authorization_code)
        refresh_token:
          type: string
          description: The refresh token (required when grant_type is refresh_token)
      required:
      - grant_type
    PostTokenResponse:
      type: object
      properties:
        access_token:
          type: string
          description: The access token to use for API calls
        expires_in:
          type: integer
          description: Token lifetime in seconds
        token_type:
          type: string
          description: Type of token (Bearer)
        scope:
          type: string
          description: The granted scopes
        refresh_token:
          type: string
          description: The refresh token for obtaining new access tokens
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
